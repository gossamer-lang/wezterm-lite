[package]
authors = ["Wez Furlong <wez@wezfurlong.org>"]
name = "wezterm-term"
version = "0.1.0"
edition = "2018"
repository = "https://github.com/gossamer-lang/wezterm-lite"
description = "The Virtual Terminal Emulator core from wezterm; helpful for implementing terminal emulators"
license = "MIT"
documentation = "https://docs.rs/wezterm-term"
keywords = ["terminal", "emulator", "vte"]
readme = "README.md"

[features]
images = ["dep:image", "wezterm-escape-parser/kitty-shm", "wezterm-cell/use_image", "wezterm-escape-parser/use_image", "wezterm-surface/use_image"]
use_serde = ["wezterm-cell/use_serde", "wezterm-escape-parser/use_serde", "wezterm-surface/use_serde"]

[dependencies]
anyhow.workspace = true
bitflags.workspace = true
csscolorparser.workspace = true
downcast-rs.workspace = true
finl_unicode.workspace = true
hex.workspace = true
humansize.workspace = true
image = { workspace = true, optional = true }
lazy_static.workspace = true
log.workspace = true
lru.workspace = true
miniz_oxide.workspace = true
num-traits.workspace = true
ordered-float.workspace = true
serde = {workspace=true, features = ["rc"]}
unicode-normalization.workspace = true
wezterm-bidi.workspace = true
wezterm-input-types.workspace = true
wezterm-dynamic = {workspace = true, features=["std"]}
wezterm-cell = {workspace = true, features=["std"]}
wezterm-escape-parser = {workspace = true, features=["std"]}
wezterm-surface = {workspace = true, features=["std", "appdata"]}

[dev-dependencies]
env_logger.workspace = true
k9.workspace = true

